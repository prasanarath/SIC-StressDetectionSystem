<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Detection App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
    --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg-secondary: rgba(255, 255, 255, 0.95);
    --text-primary: #333;
    --text-secondary: #4a5568;
    --text-light: #666;
    --border-color: #e2e8f0;
    --shadow-light: rgba(0,0,0,0.1);
    --shadow-medium: rgba(0,0,0,0.2);
    --shadow-heavy: rgba(0,0,0,0.3);
    --input-bg: white;
    --input-border: #e2e8f0;
    --input-focus: #667eea;
    --header-text: white;
    --header-shadow: rgba(0,0,0,0.3);
}

/* Dark Mode Variables */
[data-theme="dark"] {
    --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    --bg-secondary: rgba(30, 30, 46, 0.95);
    --text-primary: #e2e8f0;
    --text-secondary: #a0aec0;
    --text-light: #718096;
    --border-color: #4a5568;
    --shadow-light: rgba(0,0,0,0.3);
    --shadow-medium: rgba(0,0,0,0.4);
    --shadow-heavy: rgba(0,0,0,0.6);
    --input-bg: #2d3748;
    --input-border: #4a5568;
    --input-focus: #667eea;
    --header-text: #e2e8f0;
    --header-shadow: rgba(0,0,0,0.5);
}

/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    min-height: 100vh;
    color: var(--text-primary);
    line-height: 1.6;
    transition: all 0.3s ease;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

/* Header Styles */
.header {
    margin-bottom: 40px;
    color: var(--header-text);
}

.header-content {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.header-text h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 10px;
    text-shadow: 0 2px 4px var(--header-shadow);
}

.header-text p {
    font-size: 1.1rem;
    opacity: 0.9;
    font-weight: 300;
}

/* Dark Mode Toggle */
.dark-mode-toggle {
    display: flex;
    align-items: center;
}

.toggle-btn {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    color: var(--header-text);
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

[data-theme="dark"] .toggle-btn {
    background: rgba(255, 255, 255, 0.1);
}

[data-theme="dark"] .toggle-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

/* Main Content Layout */
.main-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: start;
}

/* Input Section */
.input-section {
    background: var(--bg-secondary);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px var(--shadow-light);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.input-card h2 {
    color: var(--text-secondary);
    margin-bottom: 25px;
    font-size: 1.5rem;
    font-weight: 600;
}

.input-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.input-group {
    display: flex;
    flex-direction: column;
}

.input-group label {
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.input-group input {
    padding: 12px 16px;
    border: 2px solid var(--input-border);
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: var(--input-bg) !important;
    color: var(--text-primary) !important;
    width: 100%;
    box-sizing: border-box;
}

.input-group input::placeholder {
    color: var(--text-secondary) !important;
    opacity: 0.7;
}

.input-group input:focus {
    outline: none;
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    background: var(--input-bg) !important;
    color: var(--text-primary) !important;
}

.button-group {
    display: flex;
    gap: 15px;
    margin-top: 10px;
}

.btn {
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: center;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
}

.btn-secondary {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    color: white;
    box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
}

.btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
}

/* Results Section */
.results-section {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* Modern Smart Watch Styles */
.watch-container {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.smartwatch {
    position: relative;
    width: 220px;
    height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.smartwatch:hover {
    transform: scale(1.05);
}

.watch-face {
    width: 200px;
    height: 200px;
    background: linear-gradient(145deg, #2d3748, #1a202c);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
        0 25px 50px var(--shadow-heavy),
        inset 0 2px 4px rgba(255,255,255,0.1),
        inset 0 -2px 4px rgba(0,0,0,0.3);
    position: relative;
    z-index: 2;
    overflow: hidden;
}

/* Glass Effect */
.watch-face::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(0,0,0,0.1) 100%);
    border-radius: 50%;
    z-index: 1;
}

/* Pulse Ring Animation */
.watch-face::after {
    content: '';
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
    border-radius: 50%;
    border: 3px solid transparent;
    animation: pulse-ring 2s ease-in-out infinite;
    z-index: 0;
}

.smartwatch.no-stress-glow .watch-face::after {
    border-color: rgba(46, 213, 115, 0.6);
    box-shadow: 0 0 20px rgba(46, 213, 115, 0.4);
}

.smartwatch.stress-glow .watch-face::after {
    border-color: rgba(255, 71, 87, 0.6);
    box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
    animation: pulse-ring-stress 1.5s ease-in-out infinite;
}

.watch-screen {
    width: 160px;
    height: 160px;
    background: linear-gradient(145deg, #1a202c, #2d3748);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    position: relative;
    z-index: 3;
    overflow: hidden;
}

/* Screen Glass Effect */
.watch-screen::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%);
    border-radius: 50%;
    z-index: 1;
}

.heart-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    animation: heartbeat-calm 3s ease-in-out infinite;
    color: #ff6b6b;
    position: relative;
    z-index: 2;
}

.heart-icon.stress {
    color: #ff4757;
    animation: heartbeat-stress 1.2s ease-in-out infinite;
}

.heart-icon.no-stress {
    color: #2ed573;
    animation: heartbeat-calm 2.5s ease-in-out infinite;
}

.status-text {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
    position: relative;
    z-index: 2;
}

.confidence-text {
    font-size: 0.8rem;
    opacity: 0.8;
    font-weight: 500;
    position: relative;
    z-index: 2;
}

/* Watch Band */
.watch-band {
    width: 220px;
    height: 70px;
    background: linear-gradient(145deg, #4a5568, #2d3748);
    border-radius: 35px;
    margin-top: -15px;
    box-shadow: 0 15px 30px var(--shadow-medium);
    position: relative;
}

.watch-band::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 20px;
    right: 20px;
    height: 50px;
    background: linear-gradient(145deg, #2d3748, #1a202c);
    border-radius: 25px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

/* Watch Glow Effects */
.smartwatch.stress-glow .watch-face {
    box-shadow: 
        0 25px 50px var(--shadow-heavy),
        inset 0 2px 4px rgba(255,255,255,0.1),
        inset 0 -2px 4px rgba(0,0,0,0.3),
        0 0 40px rgba(255, 71, 87, 0.6);
}

.smartwatch.no-stress-glow .watch-face {
    box-shadow: 
        0 25px 50px var(--shadow-heavy),
        inset 0 2px 4px rgba(255,255,255,0.1),
        inset 0 -2px 4px rgba(0,0,0,0.3),
        0 0 40px rgba(46, 213, 115, 0.6);
}

/* Result Card */
.result-card {
    background: var(--bg-secondary);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 40px var(--shadow-light);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.result-header h3 {
    color: var(--text-secondary);
    margin-bottom: 20px;
    font-size: 1.3rem;
    font-weight: 600;
}

.result-content {
    text-align: center;
}

.result-status {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 15px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.result-status.stress {
    background: linear-gradient(135deg, #ff6b6b, #ff4757);
    color: white;
    box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
    animation: stress-pulse 2s ease-in-out infinite;
}

.result-status.no-stress {
    background: linear-gradient(135deg, #2ed573, #20bf6b);
    color: white;
    box-shadow: 0 10px 30px rgba(46, 213, 115, 0.4);
}

.result-confidence {
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: 500;
}

/* Suggestions Card */
.suggestions-card {
    background: var(--bg-secondary);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 40px var(--shadow-light);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.suggestions-header h3 {
    color: var(--text-secondary);
    margin-bottom: 20px;
    font-size: 1.3rem;
    font-weight: 600;
}

.suggestions-content {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.suggestion-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: rgba(102, 126, 234, 0.1);
    border-radius: 12px;
    border-left: 4px solid #667eea;
    transition: all 0.3s ease;
}

.suggestion-item:hover {
    background: rgba(102, 126, 234, 0.15);
    transform: translateX(5px);
}

.suggestion-item i {
    font-size: 1.2rem;
    color: #667eea;
}

.suggestion-item.stress {
    background: rgba(255, 71, 87, 0.1);
    border-left-color: #ff4757;
}

.suggestion-item.stress:hover {
    background: rgba(255, 71, 87, 0.15);
}

.suggestion-item.stress i {
    color: #ff4757;
}

.suggestion-item.no-stress {
    background: rgba(46, 213, 115, 0.1);
    border-left-color: #2ed573;
}

.suggestion-item.no-stress:hover {
    background: rgba(46, 213, 115, 0.15);
}

.suggestion-item.no-stress i {
    color: #2ed573;
}

/* Loading Overlay */
.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(5px);
}

/* Virtual Pet Therapist */
.pet-therapist-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    backdrop-filter: blur(2px);
    animation: fadeIn 0.5s ease-out;
}

.pet-container {
    position: relative;
    background: var(--bg-secondary);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 25px 50px var(--shadow-heavy);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.1);
    max-width: 350px;
    text-align: center;
    animation: petBounce 0.6s ease-out;
}

.pet-close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 71, 87, 0.1);
    color: #ff4757;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pet-close-btn:hover {
    background: rgba(255, 71, 87, 0.2);
    transform: scale(1.1);
}

.pet-avatar {
    margin-bottom: 20px;
}

.pet-emoji {
    font-size: 4rem;
    animation: petWiggle 2s ease-in-out infinite;
    display: inline-block;
}

.pet-speech-bubble {
    position: relative;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 25px;
    border-radius: 20px;
    margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    animation: speechBubble 0.8s ease-out 0.3s both;
}

.pet-speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 15px solid #764ba2;
}

.pet-message {
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 1.4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.pet-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-secondary);
    opacity: 0.8;
}

/* Error Message Styling */
.error-message {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    max-width: 400px;
    animation: slideInRight 0.3s ease-out;
}

.error-content {
    background: var(--bg-secondary);
    border: 2px solid #ff4757;
    border-radius: 12px;
    padding: 16px 20px;
    box-shadow: 0 8px 25px var(--shadow-heavy);
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-primary);
    font-weight: 500;
}

.error-content i {
    color: #ff4757;
    font-size: 1.2rem;
    flex-shrink: 0;
}

.error-content span {
    flex: 1;
    line-height: 1.4;
}

.error-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s ease;
    flex-shrink: 0;
}

.error-close:hover {
    background: rgba(255, 71, 87, 0.1);
    color: #ff4757;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* Pet Animations */
@keyframes petBounce {
    0% {
        transform: scale(0.3) translateY(-50px);
        opacity: 0;
    }
    50% {
        transform: scale(1.05) translateY(0);
        opacity: 0.8;
    }
    100% {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

@keyframes petWiggle {
    0%, 100% {
        transform: rotate(0deg) scale(1);
    }
    25% {
        transform: rotate(-5deg) scale(1.05);
    }
    75% {
        transform: rotate(5deg) scale(1.05);
    }
}

@keyframes speechBubble {
    0% {
        transform: scale(0) translateY(20px);
        opacity: 0;
    }
    100% {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

/* Responsive Pet Design */
@media (max-width: 768px) {
    .pet-container {
        margin: 20px;
        padding: 25px;
        max-width: 300px;
    }
    
    .pet-emoji {
        font-size: 3.5rem;
    }
    
    .pet-message {
        font-size: 1rem;
    }
}

@media (max-width: 480px) {
    .pet-container {
        margin: 15px;
        padding: 20px;
        max-width: 280px;
    }
    
    .pet-emoji {
        font-size: 3rem;
    }
    
    .pet-message {
        font-size: 0.95rem;
    }
}

.loading-spinner {
    text-align: center;
    color: white;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

/* Animations */
@keyframes heartbeat-calm {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

@keyframes heartbeat-stress {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}

@keyframes pulse-ring {
    0% { 
        transform: scale(1);
        opacity: 1;
    }
    100% { 
        transform: scale(1.1);
        opacity: 0;
    }
}

@keyframes pulse-ring-stress {
    0% { 
        transform: scale(1);
        opacity: 1;
    }
    100% { 
        transform: scale(1.2);
        opacity: 0;
    }
}

@keyframes stress-pulse {
    0%, 100% { 
        box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
    }
    50% { 
        box-shadow: 0 15px 40px rgba(255, 71, 87, 0.6);
    }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-card, .suggestions-card {
    animation: fadeIn 0.6s ease-out;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .main-content {
        grid-template-columns: 1fr;
        gap: 30px;
    }
    
    .watch-container {
        order: -1;
    }
    
    .header-content {
        flex-direction: column;
        text-align: center;
    }
}

@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    
    .header-text h1 {
        font-size: 2rem;
    }
    
    .form-row {
        grid-template-columns: 1fr;
    }
    
    .button-group {
        flex-direction: column;
    }
    
    .smartwatch {
        width: 180px;
        height: 220px;
    }
    
    .watch-face {
        width: 160px;
        height: 160px;
    }
    
    .watch-screen {
        width: 130px;
        height: 130px;
    }
    
    .heart-icon {
        font-size: 2.5rem;
    }
    
    .status-text {
        font-size: 0.9rem;
    }
    
    .watch-band {
        width: 180px;
        height: 60px;
    }
}

@media (max-width: 480px) {
    .input-section, .result-card, .suggestions-card {
        padding: 20px;
    }
    
    .smartwatch {
        width: 160px;
        height: 200px;
    }
    
    .watch-face {
        width: 140px;
        height: 140px;
    }
    
    .watch-screen {
        width: 110px;
        height: 110px;
    }
    
    .heart-icon {
        font-size: 2rem;
    }
    
    .status-text {
        font-size: 0.8rem;
    }
    
    .watch-band {
        width: 160px;
        height: 50px;
    }
}
    </style>
</head>
<body>
    <h1> HELLLLLLLLOPWOWFOJOPF</h1>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-text">
                    <h1><i class="fas fa-heartbeat"></i> Stress Detection System</h1>
                    <p>Monitor your stress levels with advanced biometric analysis</p>

                <div class="dark-mode-toggle">

            </div>

        <div class="main-content">

            <div class="input-section">
                <div class="input-card">

                    <form id="stressForm" class="input-form">
                        <div class="form-row">
                            <div class="input-group">
                                <label for="HR">Heart Rate (BPM)</label>
                                <input type="number" id="HR" name="HR" placeholder="e.g., 75" min="40" max="200" step="0.1">
                            </div>
                            <div class="input-group">
                                <label for="EDA">Electrodermal Activity</label>
                                <input type="number" id="EDA" name="EDA" placeholder="e.g., 0.5" min="0" max="2" step="0.01">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="TEMP">Temperature (°C)</label>
                                <input type="number" id="TEMP" name="TEMP" placeholder="e.g., 36.5" min="35" max="40" step="0.1">
                            </div>
                            <div class="input-group">
                                <label for="BVP">Blood Volume Pulse</label>
                                <input type="number" id="BVP" name="BVP" placeholder="e.g., 0.8" min="0" max="1" step="0.01">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="ACC_X">Acceleration X</label>
                                <input type="number" id="ACC_X" name="ACC_X" placeholder="e.g., 0.05" min="-1" max="1" step="0.01">
                            </div>
                            <div class="input-group">
                                <label for="ACC_Y">Acceleration Y</label>
                                <input type="number" id="ACC_Y" name="ACC_Y" placeholder="e.g., -0.02" min="-1" max="1" step="0.01">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-group">
                                <label for="ACC_Z">Acceleration Z</label>
                                <input type="number" id="ACC_Z" name="ACC_Z" placeholder="e.g., 0.01" min="-1" max="1" step="0.01">
                            </div>
                            <div class="input-group">
                                <label for="IBI">Inter-Beat Interval</label>
                                <input type="number" id="IBI" name="IBI" placeholder="e.g., 0.85" min="0" max="1" step="0.01">
                            </div>
                        </div>

                        <div class="button-group">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-brain"></i> Analyze Stress Level
                            </button>
                            <button type="button" id="randomBtn" class="btn btn-secondary">
                                <i class="fas fa-dice"></i> Generate Random Sample
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">

                <div class="watch-container">
                    <div class="smartwatch" id="smartwatch">
                        <div class="watch-face">
                            <div class="watch-screen">
                                <div class="heart-icon" id="heartIcon">
                                    <i class="fas fa-heart"></i>
                                </div>
                                <div class="status-text" id="statusText">Waiting for input</div>
                                <div class="confidence-text" id="confidenceText"></div>
                            </div>
                        </div>
                        <div class="watch-band"></div>
                    </div>
                </div>

                <!-- Result Card -->
                <div class="result-card" id="resultCard" style="display: none;">
                    <div class="result-header">
                        <h3><i class="fas fa-chart-line"></i> Analysis Result</h3>
                    </div>
                    <div class="result-content">
                        <div class="result-status" id="resultStatus"></div>
                        <div class="result-confidence" id="resultConfidence"></div>
                    </div>
                </div>

                <!-- Suggestions Section -->
                <div class="suggestions-card" id="suggestionsCard" style="display: none;">
                    <div class="suggestions-header">
                        <h3><i class="fas fa-lightbulb"></i> Personalized Recommendations</h3>
                    </div>
                    <div class="suggestions-content" id="suggestionsContent">

                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay" style="display: none;">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Analyzing your biometric data...</p>
            </div>
        </div>

        <!-- Virtual Pet Therapist -->
        <div class="pet-therapist-overlay" id="petTherapist" style="display: none;">

        </div>
    </div>
